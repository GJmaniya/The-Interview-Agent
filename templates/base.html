<!doctype html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Interview Agent{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "inverse-on-surface": "#233143", "on-secondary-fixed-variant": "#004e5a",
          "on-tertiary": "#233148", "on-secondary-container": "#00515d",
          "background": "#051424", "error-container": "#93000a",
          "surface-container-lowest": "#010f1f", "on-primary-fixed-variant": "#2f2ebe",
          "tertiary-fixed-dim": "#b9c7e4", "surface-variant": "#273647",
          "surface-container-low": "#0d1c2d", "outline-variant": "#464554",
          "on-primary": "#1000a9", "inverse-primary": "#494bd6",
          "tertiary-container": "#8391ad", "primary": "#c0c1ff",
          "secondary-container": "#00cbe6", "tertiary-fixed": "#d6e3ff",
          "on-secondary": "#00363e", "on-secondary-fixed": "#001f25",
          "surface-tint": "#c0c1ff", "on-tertiary-fixed-variant": "#39475f",
          "on-tertiary-fixed": "#0d1c32", "surface-container": "#122131",
          "primary-fixed": "#e1e0ff", "secondary-fixed-dim": "#2fd9f4",
          "surface-dim": "#051424", "inverse-surface": "#d4e4fa",
          "surface-bright": "#2c3a4c", "on-surface": "#d4e4fa",
          "error": "#ffb4ab", "on-primary-fixed": "#07006c",
          "on-error-container": "#ffdad6", "surface-container-high": "#1c2b3c",
          "primary-container": "#8083ff", "on-tertiary-container": "#1c2a41",
          "on-background": "#d4e4fa", "tertiary": "#b9c7e4",
          "secondary-fixed": "#a2eeff", "outline": "#908fa0",
          "surface-container-highest": "#273647", "on-surface-variant": "#c7c4d7",
          "on-error": "#690005", "secondary": "#5de6ff",
          "on-primary-container": "#0d0096", "primary-fixed-dim": "#c0c1ff",
          "surface": "#051424",
        },
        borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
        spacing: { "margin-mobile": "16px", "margin-desktop": "64px", "container-max": "1440px", gutter: "24px", unit: "4px" },
        fontFamily: {
          "technical-label": ["JetBrains Mono"], "headline-lg": ["Geist"],
          "display-lg": ["Geist"], "body-md": ["Inter"],
          "headline-lg-mobile": ["Geist"], "body-sm": ["Inter"],
        },
        fontSize: {
          "technical-label": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
          "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
          "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
          "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
          "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],
          "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
        },
      },
    },
  };
</script>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col {% block body_overflow %}overflow-hidden{% endblock %} selection:bg-primary-container selection:text-on-primary-container">

<!-- Ambient depth + interactive particle field, shared across every page -->
<div class="fixed inset-0 pointer-events-none" style="background: radial-gradient(ellipse 120% 60% at 50% -10%, #0d2338 0%, #051424 55%, #030c17 100%);"></div>
<canvas id="bg-particles" class="fixed inset-0 w-full h-full pointer-events-none"></canvas>

{% include "_header.html" %}

<div class="flex flex-1 overflow-hidden relative">
{% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='particles.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
